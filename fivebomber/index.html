<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファイブボンバー</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">

    <h1>ファイブボンバー</h1>

    <section id="settings-screen">

      <h2>プレイヤー設定</h2>

      <div class="player-setting">
        <label>プレイヤー1</label>
        <select id="player1">
          <option value="human">人間</option>
          <option value="bot">BOT</option>
        </select>
      </div>

      <div class="player-setting">
        <label>プレイヤー2</label>
        <select id="player2">
          <option value="human">人間</option>
          <option value="bot" selected>BOT</option>
        </select>
      </div>

      <div class="player-setting">
        <label>プレイヤー3</label>
        <select id="player3">
          <option value="human">人間</option>
          <option value="bot" selected>BOT</option>
        </select>
      </div>

      <div class="player-setting">
        <label>プレイヤー4</label>
        <select id="player4">
          <option value="human">人間</option>
          <option value="bot" selected>BOT</option>
        </select>
      </div>

      <div class="player-setting">
        <label>プレイヤー5</label>
        <select id="player5">
          <option value="human">人間</option>
          <option value="bot" selected>BOT</option>
        </select>
      </div>

      <h2>ジャンル選択</h2>

      <div id="genre-list">

        <label>
          <input type="checkbox" checked value="geography">
          地理
        </label>

        <label>
          <input type="checkbox" checked value="history">
          歴史
        </label>

        <label>
          <input type="checkbox" checked value="japanese">
          国語
        </label>

        <label>
          <input type="checkbox" checked value="sakurazaka46">
          櫻坂46
        </label>

      </div>

      <button id="start-btn">
        ゲーム開始
      </button>

    </section>

    <section id="game-screen" hidden>

  <h2 id="question">
    問題がここに表示されます
  </h2>

  <div id="progress"></div>

  <div id="timer">
  残り時間: 45秒
  </div>

  <div id="current-player">

  <div id="bot-status"></div>

現在の解答者：
<span id="current-player-name">
-
</span>

</div>

  <div id="players"></div>

  <div id="answer-area">

  <input
    type="text"
    id="answer-input"
    placeholder="答えを入力"
  >

  <button id="answer-btn">
    解答
  </button>

</div>

<div id="answer-history"></div>

</section>

<section id="result-screen" hidden>

  <h1 id="result-title">
    RESULT
  </h1>

  <div id="result-score">
    0 POINTS
  </div>

  <div id="result-detail"></div>

  <div id="result-total"></div>

  <div id="bomb">
  💣
</div>

  <button id="next-btn">
    次の問題へ
  </button>

  <button id="finish-btn">
    終了する
  </button>

</section>

  </div>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
